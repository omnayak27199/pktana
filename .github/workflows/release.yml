name: Release

# Triggers on any v* tag push (e.g. v0.7.0) or manually.
# Builds RPM, .deb, tarball, macOS .dmg, Windows installer → uploads all to
# the GitHub Release so that the stable /releases/latest/download/ URLs always
# point to the newest version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v0.7.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# ─────────────────────────────────────────────────────────────────────────────
# 1. RESOLVE VERSION from the git tag
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building pktana $VERSION (tag: $TAG)"

# ─────────────────────────────────────────────────────────────────────────────
# 2. RPM — RHEL/Rocky/Alma 9  and  RHEL/CentOS 7
#
# Strategy: run on ubuntu-latest so actions/checkout works (Node.js 24
# requires GLIBC 2.27+ which CentOS 7 doesn't have).  The entire Rust build
# and rpmbuild run inside the target OS via `docker run`, so the binary links
# against the correct glibc and the .el7/.el9 dist tag is set properly.
# ─────────────────────────────────────────────────────────────────────────────
  rpm:
    name: RPM (${{ matrix.os_type }})
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_type: el9
            image: rockylinux:9
          - os_type: el7
            image: centos:7
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Write the build script to a file — avoids all quoting issues inside
      # the docker run command when mixing GitHub expressions with bash vars.
      - name: Write in-container build script
        run: |
          cat > /tmp/rpm-build.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -euxo pipefail
          OS_TYPE="$1"
          PKG_VERSION="$2"

          # ── package manager setup ────────────────────────────────────────
          if [ "$OS_TYPE" = "el7" ]; then
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-* 2>/dev/null || true
            sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' \
              /etc/yum.repos.d/CentOS-* 2>/dev/null || true
            yum install -y gcc libpcap-devel openssl-devel pkgconfig \
              perl-IPC-Cmd perl-Data-Dumper rpm-build make curl tar gzip ca-certificates
          else
            dnf install -y epel-release dnf-plugins-core
            dnf config-manager --set-enabled crb
            dnf install -y gcc libpcap-devel openssl-devel pkgconf-pkg-config \
              perl-core rpm-build make curl tar gzip ca-certificates
          fi

          # ── Rust ─────────────────────────────────────────────────────────
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          # shellcheck source=/dev/null
          source "$HOME/.cargo/env"

          # ── build binary ─────────────────────────────────────────────────
          cargo build --release --features pcap,tui -p pktana-cli

          # ── create RPM (mirrors what `make pktana` does, without check) ──
          mkdir -p dist/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p "dist/rpm-src/pktana-$PKG_VERSION"
          cp target/release/pktana "dist/rpm-src/pktana-$PKG_VERSION/pktana"
          cp README.md             "dist/rpm-src/pktana-$PKG_VERSION/README.md"
          tar -czf "dist/pktana-$PKG_VERSION.tar.gz" -C dist/rpm-src "pktana-$PKG_VERSION"
          cp "dist/pktana-$PKG_VERSION.tar.gz" dist/rpmbuild/SOURCES/
          cp deploy/centos/pktana.spec          dist/rpmbuild/SPECS/pktana.spec
          rpmbuild \
            --define "_topdir $(pwd)/dist/rpmbuild" \
            --define "pkg_version $PKG_VERSION" \
            --define "pkg_release 1" \
            --define "dist .$OS_TYPE" \
            -bb dist/rpmbuild/SPECS/pktana.spec
          echo "✅ RPM built:"
          find dist/rpmbuild/RPMS -name '*.rpm'

          # Fix ownership so the ubuntu runner can read the output
          chown -R "$(stat -c '%u:%g' /workspace)" dist/ target/ || true
          SCRIPT
          chmod +x /tmp/rpm-build.sh

      - name: Build RPM inside ${{ matrix.image }}
        run: |
          # Mount the workspace and the build script into the target OS container.
          # Also mount the host cargo registry to avoid re-downloading all crates.
          mkdir -p ~/.cargo/registry ~/.cargo/git
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "/tmp/rpm-build.sh:/rpm-build.sh:ro" \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -v "$HOME/.cargo/git:/root/.cargo/git" \
            -w /workspace \
            "${{ matrix.image }}" \
            bash /rpm-build.sh "${{ matrix.os_type }}" "$VERSION"

      - name: Collect RPMs and create stable alias
        run: |
          mkdir -p dist/upload
          find dist/rpmbuild/RPMS -name '*.rpm' -exec cp {} dist/upload/ \;
          src=$(find dist/upload -name '*.rpm' \
                  ! -name "pktana-${{ matrix.os_type }}.rpm" | head -1)
          [ -n "$src" ] && cp "$src" "dist/upload/pktana-${{ matrix.os_type }}.rpm"
          ls -lh dist/upload/

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.os_type }}
          path: dist/upload/*.rpm

# ─────────────────────────────────────────────────────────────────────────────
# 3. DEB + tarball — Ubuntu 22.04 / 24.04 / Debian 12
# ─────────────────────────────────────────────────────────────────────────────
  deb:
    name: DEB (${{ matrix.label }})
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu22.04
            image: ubuntu:22.04
          - label: ubuntu24.04
            image: ubuntu:24.04
          - label: debian12
            image: debian:12
    container:
      image: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc libpcap-dev libssl-dev make git curl ca-certificates \
            dpkg-dev fakeroot pkg-config build-essential

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --features pcap,tui -p pktana-cli

      - name: Build .deb with cargo-deb
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install cargo-deb --locked
          mkdir -p dist
          cd crates/pktana-cli
          cargo deb --no-build --no-strip \
            --output "../../dist/pktana_${VERSION}_amd64_${{ matrix.label }}.deb"

      - name: Build tarball and stable aliases
        run: |
          # Versioned tarball
          tar -czf "dist/pktana-${VERSION}-${{ matrix.label }}-x86_64.tar.gz" \
            -C target/release pktana
          # Stable aliases — these are what /releases/latest/download/ resolves to
          cp "dist/pktana_${VERSION}_amd64_${{ matrix.label }}.deb" \
             "dist/pktana-${{ matrix.label }}.deb"
          cp "dist/pktana-${VERSION}-${{ matrix.label }}-x86_64.tar.gz" \
             "dist/pktana-${{ matrix.label }}.tar.gz"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: |
            dist/*.deb
            dist/*.tar.gz

# ─────────────────────────────────────────────────────────────────────────────
# 4. macOS .dmg (Electron desktop app)
# ─────────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS .dmg
    needs: meta
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap
        run: brew install libpcap

      - name: Build pktana binary
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/libpcap/lib/pkgconfig:/usr/local/opt/libpcap/lib/pkgconfig
        run: cargo build --release --features pcap,tui -p pktana-cli

      - name: Stage binary for Electron
        run: |
          mkdir -p pktana-desktop/resources/bin
          cp target/release/pktana pktana-desktop/resources/bin/pktana
          chmod +x pktana-desktop/resources/bin/pktana
          pktana-desktop/resources/bin/pktana --version

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package .dmg
        working-directory: pktana-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install
          npm run dist:mac
          # Ad-hoc codesign nested .app bundles
          find dist -name '*.app' -print0 | while IFS= read -r -d '' app; do
            codesign --force --deep --sign - "$app" || true
            bin="$app/Contents/Resources/bin/pktana"
            [ -x "$bin" ] && codesign --force --sign - "$bin" || true
            codesign --force --deep --sign - "$app" || true
          done
          # Stable aliases
          dmg=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$dmg" ] && cp "$dmg" dist/pktana-macos.dmg && echo "Stable DMG: dist/pktana-macos.dmg"
          zip=$(find dist -maxdepth 1 -name '*.zip' | head -1)
          [ -n "$zip" ] && cp "$zip" dist/pktana-macos.zip || true
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            pktana-desktop/dist/*.dmg
            pktana-desktop/dist/*.zip

# ─────────────────────────────────────────────────────────────────────────────
# 5. Windows .exe installer (Electron + Npcap SDK)
# ─────────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $sdk = "C:\Npc_SDK"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath $sdk -Force
          if (-not (Test-Path "$sdk\Include") -and (Test-Path "$sdk\npcap-sdk-1.13\Include")) {
            Copy-Item -Recurse "$sdk\npcap-sdk-1.13\*" $sdk -Force
          }
          "NPCAP_SDK=$sdk"             >> $env:GITHUB_ENV
          "LIB=$sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV
          "INCLUDE=$sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      - name: Build pktana.exe
        shell: pwsh
        run: |
          cargo build --release --features pcap,tui -p pktana-cli
          $exe = "target\release\pktana.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem -Path target -Recurse -Filter pktana.exe |
              Where-Object { $_.FullName -match '\\release\\pktana\.exe$' } |
              Select-Object -First 1
            if (-not $found) { Write-Error "pktana.exe not found after build"; exit 1 }
            $exe = $found.FullName
          }
          New-Item -ItemType Directory -Force -Path pktana-desktop\resources\bin | Out-Null
          Copy-Item $exe pktana-desktop\resources\bin\pktana.exe -Force

      - name: Package Windows installer
        working-directory: pktana-desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if (-not (Test-Path resources\bin\pktana.exe)) {
            Write-Error "resources\bin\pktana.exe missing"; exit 1
          }
          npm install
          npm run dist:win
          # Stable alias
          $setup = Get-ChildItem -Path dist -Filter '*Setup*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName dist\pktana-windows-setup.exe
            Write-Host "Stable alias: dist\pktana-windows-setup.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: pktana-desktop/dist/*.exe

# ─────────────────────────────────────────────────────────────────────────────
# 6. PUBLISH — collect every artifact, create/update GitHub Release
# ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to GitHub Release
    needs: [meta, rpm, deb, macos, windows]
    # Run even if macOS/Windows failed — Linux packages are what matter most
    if: always() && (needs.rpm.result == 'success' || needs.deb.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG:     ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten into upload/
        run: |
          mkdir -p upload
          find artifacts -type f \( \
            -name '*.rpm' -o -name '*.deb' -o -name '*.tar.gz' \
            -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
          \) -exec cp {} upload/ \;
          echo "──── Release assets for $TAG ────"
          ls -lh upload/ | sort -k5 -h

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "pktana ${{ env.TAG }}"
          generate_release_notes: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
