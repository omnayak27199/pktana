name: Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'pktana-desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    name: Build pktana Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $sdk = "C:\Npc_SDK"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          $url = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri $url -OutFile npcap-sdk.zip
          Expand-Archive -Path npcap-sdk.zip -DestinationPath $sdk -Force
          # Layout can be nested; normalize Include/Lib
          if (-not (Test-Path "$sdk\Include") -and (Test-Path "$sdk\npcap-sdk-1.13\Include")) {
            Copy-Item -Recurse "$sdk\npcap-sdk-1.13\*" $sdk -Force
          }
          echo "NPCAP_SDK=$sdk" >> $env:GITHUB_ENV
          echo "LIB=$sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV
          echo "INCLUDE=$sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      - name: Build pktana.exe (pcap + tui)
        shell: pwsh
        run: |
          cargo build --release --features pcap,tui -p pktana-cli
          $exe = "target\release\pktana.exe"
          if (-not (Test-Path $exe)) {
            # Fallback if cargo used a target triple subdirectory
            $found = Get-ChildItem -Path target -Recurse -Filter pktana.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\release\\pktana\.exe$' } |
              Select-Object -First 1
            if ($null -eq $found) {
              Write-Error "pktana.exe not found after cargo build"
              Get-ChildItem -Path target -Recurse -Filter '*.exe' | Select-Object -ExpandProperty FullName
              exit 1
            }
            $exe = $found.FullName
          }
          New-Item -ItemType Directory -Force -Path pktana-desktop\resources\bin | Out-Null
          Copy-Item $exe pktana-desktop\resources\bin\pktana.exe -Force
          Get-Item pktana-desktop\resources\bin\pktana.exe | Format-List FullName, Length, LastWriteTime
          # Do NOT run pktana.exe here: CI has the Npcap SDK for linking, but not the
          # Npcap runtime (wpcap.dll). Executing would fail with exit code 1 even though
          # the build succeeded. End users install Npcap separately.

      - name: Package Windows installer
        working-directory: pktana-desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if (-not (Test-Path resources\bin\pktana.exe)) {
            Write-Error "resources\bin\pktana.exe missing — build step must stage it before packaging"
            exit 1
          }
          npm install
          npm run dist:win
          # Verify the unpacked app actually contains the engine
          $found = Get-ChildItem -Path dist -Recurse -Filter pktana.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\resources\\bin\\pktana\.exe$' }
          if (-not $found) {
            Write-Error "Packaged app is missing resources\bin\pktana.exe (electron-builder may have skipped a gitignored file). afterPack should have copied it."
            Get-ChildItem -Path dist -Recurse -Filter '*.exe' | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "Packaged engine OK:"
          $found | Format-Table FullName, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            pktana-desktop/dist/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pktana-desktop/dist/*.exe
