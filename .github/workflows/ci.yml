name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libpcap-dev
        run: sudo apt-get install -y libpcap-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --features pcap,tui,mcp --all

      - name: Test
        run: cargo test --features pcap,tui,mcp --all

      - name: Clippy
        run: cargo clippy --features pcap,tui,mcp -- -D warnings
